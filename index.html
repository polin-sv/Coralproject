<!DOCTYPE html>
<html lang="en">

<head>

    <header>

                    <li><a href=""><img src="img/logo.svg"></a></li>
                    <li class="top-nav-link-item">
                        <span class="top-nav-link-vrapper">

                            </a>

            </nav>
            <nav>

                        <h1 class="roboto-300">Collections</h1>

                        </div>
                        <div class="hero-section-img">
                            <img src="img/image-product.png" width="424px" height="424">

                    </div>

        </section>
        <section class="brand-section">

                <div class="models">

                        <img src="img/card1.png">
                    </div>
                    <div class="model-right">
